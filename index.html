<body>

<button class="ai-fab" onclick="toggleAiPanel()" id="ai-fab-btn">🤖 KI-Assistent</button>
<div id="ai-panel">
  <div class="ai-panel-header">
    <div class="ai-panel-title">🤖 KI-Terminassistent <span style="font-size:.72rem;font-weight:400;color:var(--text3);margin-left:4px">kostenlos · Gemini</span></div>
    <button class="ai-panel-close" onclick="toggleAiPanel()">✕</button>
  </div>
  <div class="ai-messages" id="ai-messages">
    <div class="ai-msg assistant">Hallo! Ich bin dein KI-Terminassistent (kostenlos mit Google Gemini).<br><br>Beispiele:<br>• „Erstelle einen Trainingsplan für diese Woche"<br>• „Nächste Termine anzeigen"<br>• „Füge morgen um 10 Uhr Meeting hinzu"</div>
  </div>
  <div class="ai-quick-btns">
    <button class="ai-quick-btn" onclick="aiQuick('Erstelle einen Trainingsplan für diese Woche')">💪 Trainingsplan</button>
    <button class="ai-quick-btn" onclick="aiQuick('Plane 3 Fokus-Blöcke à 2h diese Woche')">🎯 Fokus-Blöcke</button>
    <button class="ai-quick-btn" onclick="aiQuick('Was sind meine nächsten Termine?')">📅 Nächste Termine</button>
  </div>
  <div class="ai-input-row">
    <textarea class="ai-input" id="ai-input" rows="1" placeholder="Schreibe deinen Wunsch …" onkeydown="aiInputKeydown(event)"></textarea>
    <button class="ai-send-btn" id="ai-send-btn" onclick="sendAiMessage()">➤</button>
  </div>
</div>

<script type="module">
  // ---------- Firebase Imports & Config (deine bestehende Konfiguration) ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, where, onSnapshot, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, updateEmail, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { GoogleGenerativeAI } from "@google/generative-ai";

  const firebaseConfig = {
    apiKey: "AIzaSyD6OKm3jYYsZWhVyTmhDvHJ0EeDMT2RzXs",
    authDomain: "planpro-siyo.firebaseapp.com",
    databaseURL: "https://planpro-siyo-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "planpro-siyo",
    storageBucket: "planpro-siyo.firebasestorage.app",
    messagingSenderId: "540852603323",
    appId: "1:540852603323:web:070805fd4a33dbf9469c9e",
    measurementId: "G-T4YGD7GVB1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.db = db;
  window.addDoc = addDoc;
  window.updateDoc = updateDoc;
  window.deleteDoc = deleteDoc;
  window.doc = doc;

  // ---------- GLOBALE STATE (deine bestehenden Variablen) ----------
  let currentUser = null;
  let calDate = new Date();
  let bookingFilter = 'all';
  let bookingRangeMode = 'all';
  let bookingRangeFrom = '';
  let bookingRangeTo = '';
  let editingEventId = null;
  let currentPage = 'dashboard';
  let events = [];
  let eventsUnsubscribe = null;
  let sortField = 'date';
  let sortDirection = 'asc';
  const SETTINGS_KEY = 'planpro_settings';

  // ---------- KI-ASSISTENT (Google Gemini, kostenlos) ----------
  // 1. Ersetze 'HIER_DEINEN_GEMINI_API_KEY_EINFÜGEN' mit deinem echten Key von aistudio.google.com
  const GEMINI_API_KEY = 'HIER_DEINEN_GEMINI_API_KEY_EINFÜGEN';
  let genAI = null;
  let model = null;
  
  // Initialisiere Gemini, falls ein Key vorhanden ist (nicht der Platzhalter)
  if (GEMINI_API_KEY && GEMINI_API_KEY !== 'HIER_DEINEN_GEMINI_API_KEY_EINFÜGEN') {
    genAI = new GoogleGenerativeAI(GEMINI_API_KEY);
    model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
  } else {
    console.warn("⚠️ Bitte trage deinen eigenen Gemini API-Key in der Datei ein (Zeile mit GEMINI_API_KEY).");
  }

  let aiPanelOpen = false;
  window.toggleAiPanel = function() {
    const panel = document.getElementById('ai-panel');
    aiPanelOpen = !aiPanelOpen;
    if (aiPanelOpen) {
      panel.classList.add('open');
      document.getElementById('ai-input').focus();
    } else {
      panel.classList.remove('open');
    }
  };

  window.aiQuick = function(promptText) {
    document.getElementById('ai-input').value = promptText;
    sendAiMessage();
  };

  window.aiInputKeydown = function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendAiMessage();
    }
  };

  async function sendAiMessage() {
    const inputEl = document.getElementById('ai-input');
    const msg = inputEl.value.trim();
    if (!msg) return;

    // Chat-Nachricht Benutzer anzeigen
    const messagesDiv = document.getElementById('ai-messages');
    const userMsgDiv = document.createElement('div');
    userMsgDiv.className = 'ai-msg user';
    userMsgDiv.textContent = msg;
    messagesDiv.appendChild(userMsgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    inputEl.value = '';

    const sendBtn = document.getElementById('ai-send-btn');
    sendBtn.disabled = true;

    // Denkblase
    const thinkingDiv = document.createElement('div');
    thinkingDiv.className = 'ai-msg assistant thinking';
    thinkingDiv.textContent = '🤔 Denke nach ...';
    messagesDiv.appendChild(thinkingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      if (!model) {
        throw new Error('Gemini wurde nicht initialisiert. Bitte API-Key eintragen.');
      }
      // Kontext für den KI-Assistenten (System-Prompt)
      const systemInstruction = `Du bist ein hilfreicher Terminplanungs-Assistent für eine Kalender-App. 
Der Benutzer hat einen persönlichen Kalender. Beantworte Fragen zu Terminplanung, 
gib Empfehlungen für Tagesabläufe, erstelle Vorschläge für wiederkehrende Termine. 
Antworte kurz, freundlich und präzise. Du kannst keine Termine direkt im Kalender erstellen, 
sondern nur Vorschläge machen. Wenn der Benutzer einen konkreten Termin erstellen möchte, 
bitte ihn, das manuell über das + Symbol zu tun.`;

      // Gemini API aufrufen (Chat-Verlauf nicht gespeichert, nur einzelne Nachricht)
      const result = await model.generateContent({
        contents: [{ role: "user", parts: [{ text: systemInstruction + "\n\nBenutzer: " + msg }] }]
      });
      const assistantReply = result.response.text();

      // Denkblase entfernen, echte Antwort einfügen
      thinkingDiv.remove();
      const assistantMsgDiv = document.createElement('div');
      assistantMsgDiv.className = 'ai-msg assistant';
      assistantMsgDiv.innerHTML = assistantReply.replace(/\n/g, '<br>');
      messagesDiv.appendChild(assistantMsgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Optional: Wenn die Antwort einen Terminvorschlag enthält, zeige einen Button "Termin erstellen"
      if (assistantReply.toLowerCase().includes('termin') || assistantReply.toLowerCase().includes('erstellen')) {
        const previewDiv = document.createElement('div');
        previewDiv.className = 'ai-event-preview';
        previewDiv.innerHTML = '<h4>📅 Möchtest du einen neuen Termin anlegen?</h4><button class="btn btn-primary" onclick="openNewEventModal()">+ Termin erstellen</button>';
        assistantMsgDiv.appendChild(previewDiv);
      }
    } catch (err) {
      console.error('Fehler bei Gemini:', err);
      thinkingDiv.textContent = '⚠️ KI nicht erreichbar. Bitte später erneut versuchen oder API-Key prüfen.';
      thinkingDiv.classList.remove('thinking');
    } finally {
      sendBtn.disabled = false;
    }
  }
  window.sendAiMessage = sendAiMessage;

  // ---------- FEHLENDE FUNKTIONEN (openNewEventModalTime, etc.) ----------
  window.openNewEventModalTime = function(date, time) {
    // Wird in Day/Week View verwendet, um einen Termin mit voreingestellter Uhrzeit zu erstellen
    editingEventId = null;
    const modalHtml = `
      <h2>Neuer Termin</h2>
      <div class="form-group"><label>Titel</label><input type="text" id="ev-title" placeholder="Termintitel"></div>
      <div class="form-row">
        <div class="form-group"><label>Datum</label><input type="date" id="ev-date" value="${date}"></div>
        <div class="form-group"><label>Uhrzeit von</label><input type="time" id="ev-time" value="${time}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Datum bis (optional)</label><input type="date" id="ev-date-end" value="${date}"></div>
        <div class="form-group"><label>Uhrzeit bis (optional)</label><input type="time" id="ev-time-end" value=""></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kategorie</label><select id="ev-cat">${['Arbeit','Privat','Meeting','Sonstiges'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="form-group"><label>Farbe</label><select id="ev-color"><option value="0">Türkis</option><option value="1">Orange</option><option value="2">Grün</option></select></div>
      </div>
      <div class="form-group"><label>Notiz</label><textarea id="ev-note" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveEvent()">Speichern</button>
      </div>
    `;
    document.getElementById('modal-box').innerHTML = modalHtml;
    openModal();
  };

  // ---------- HIER ALLE WEITEREN DEINEN BESTEHENDEN FUNKTIONEN EINFÜGEN ----------
  // (z.B. doLogin, doRegister, renderDashboard, renderCalendar, etc.)
  // Der gesamte restliche Code (Firebase-Auth, Events, Kalender, Drag&Drop, etc.) 
  // muss aus deiner ursprünglichen Datei übernommen werden.
  // Aus Platzgründen ist hier nur die KI-Erweiterung und die fehlende Funktion dargestellt.
  // Bitte kopiere deinen kompletten bestehenden JavaScript-Code ab der Stelle, 
  // wo die auth-Listener beginnen, in diese Datei.

  // HINWEIS: Da deine Originaldatei sehr lang ist, kannst du deinen vollständigen 
  // JavaScript-Code (ab Zeile ca. 1100) hier einfügen. Achte darauf, dass die 
  // Funktionen toggleAiPanel, sendAiMessage, aiQuick, aiInputKeydown nicht 
  // überschrieben werden. Du kannst sie einfach oberhalb deines Codes belassen.

  // Um eine funktionierende Gesamtdatei zu erhalten, füge bitte den Rest deines 
  // Scripts (ab der Zeile, wo die Firebase-Listener definiert sind) hier an.
  // Beispiel: 
  // onAuthStateChanged(auth, async (user) => { ... });
  // startEventsListener, renderBookings, etc.

  console.log("SiyoPlan mit kostenlosem KI-Assistent (Gemini) bereit.");
</script>
